# Syncs catalog/ against upstream raycast/extensions.
#
# CADENCE REALITY: the cron below asks for every 20 minutes, but GitHub's
# `schedule:` event is best-effort and heavily throttles frequent crons — in
# practice these runs land roughly every 60-90 minutes, not every 20, and
# some slots are skipped entirely under load. This is a documented GitHub
# limitation, not a config error; there is no cron value that makes GitHub
# honor sub-hourly scheduling. For true 20-minute cadence, drive the workflow
# from an EXTERNAL scheduler via the `repository_dispatch` trigger below or the
# workflow_dispatch API — those are not throttled the way `schedule` is.
# Minutes are offset off :00/:20/:40 because the top-of-hour is the most
# contended (and therefore most-delayed) slot on GitHub's scheduler.
#
# NOTE: GitHub only runs scheduled workflows from the repository's DEFAULT
# branch, and pauses them after 60 days without repo activity.
name: Catalog sync

on:
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_dispatch: {}
  repository_dispatch:
    types: [catalog-sync]

permissions:
  contents: write

concurrency:
  group: catalog-sync
  cancel-in-progress: false

jobs:
  sync:
    # Guard so the schedule never runs if this file ever reaches other forks
    # or the upstream repository.
    if: github.repository == 'mayankchugh-learning/r'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The repo is multi-gigabyte; fetch manifests only.
          filter: blob:none
          sparse-checkout: |
            /*
            !/extensions/
            !/docs/
            !/examples/
            !/images/
            !/migrations/
            !/templates/
            /extensions/*/package.json
          sparse-checkout-cone-mode: false

      - name: Sync catalog with upstream
        run: |
          if [ ! -f scripts/extension-catalog/sync.mjs ]; then
            echo "catalog tooling is not on this branch; nothing to do"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/extension-catalog/sync.mjs --push

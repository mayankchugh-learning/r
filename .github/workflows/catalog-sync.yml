# Syncs catalog/ against upstream raycast/extensions.
#
# TRIGGERS: this workflow is driven entirely by EXTERNAL triggers, because
# GitHub's own `schedule:` event is best-effort and heavily throttles frequent
# crons (never honors sub-hourly cadence). external dispatch is not throttled.
#   • repository_dispatch (type catalog-sync) — the primary/fallback path:
#       - PRIMARY: scripts/extension-catalog/poll-and-dispatch.sh on an always-on
#         host fires this within ~1-2 min of a real upstream commit.
#       - FALLBACK: a web-cron (e.g. cron-job.org) POSTs the same dispatch on a
#         coarse interval, covering the host being offline AND driving the
#         ~daily download-count refresh on days with no upstream change.
#   • workflow_dispatch — manual "Run workflow" button / API.
# The sync itself no-ops cheaply when upstream HEAD is unchanged and downloads
# aren't due, so redundant triggers cost ~one git fetch.
name: Catalog sync

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [catalog-sync]

permissions:
  contents: write

concurrency:
  group: catalog-sync
  cancel-in-progress: false

jobs:
  sync:
    # Guard so this never runs if the file ever reaches another fork.
    if: github.repository == 'mayankchugh-learning/r'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The repo is multi-gigabyte; fetch manifests only.
          filter: blob:none
          sparse-checkout: |
            /*
            !/extensions/
            !/docs/
            !/examples/
            !/images/
            !/migrations/
            !/templates/
            /extensions/*/package.json
          sparse-checkout-cone-mode: false

      - name: Sync catalog with upstream
        run: |
          if [ ! -f scripts/extension-catalog/sync.mjs ]; then
            echo "catalog tooling is not on this branch; nothing to do"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/extension-catalog/sync.mjs --push
